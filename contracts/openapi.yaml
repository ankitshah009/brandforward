openapi: 3.1.0
info:
  title: BrandForward Engine
  version: 0.2.0
  description: >
    Local pre-publishability pipeline. Binds to 127.0.0.1:8787. Raw media is
    served to loopback only. `GET /jobs/{id}/proxy` and the egress ledger are
    the only documents meant to leave the workstation. Errors are
    `{"detail": string}`.
servers:
  - url: http://127.0.0.1:8787
tags:
  - name: node
  - name: jobs
  - name: planning
  - name: verification
  - name: render
  - name: media

paths:
  /health:
    get:
      tags: [node]
      summary: Liveness and the pinned receipt key.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, node, version, public_key]
                properties:
                  ok: {const: true}
                  node: {type: string, example: local-m5-max}
                  version: {type: string}
                  public_key: {type: string, description: Base64 Ed25519 public key.}

  /nodes:
    get:
      tags: [node]
      summary: This node plus any nodes in infra/nodes.json.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      description: >
                        The first node is this process and carries `capabilities`
                        (per-stage state: real, layout, fixture, rule, configured).
                      additionalProperties: true
                  warning: {type: string}

  /jobs:
    get:
      tags: [jobs]
      summary: Job index.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {$ref: "#/components/schemas/JobId"}
                        title: {type: string}
                        fixture_id: {type: string}
                        status: {type: string, enum: [ready, rendered]}
                        created_at: {type: string, format: date-time}
    post:
      tags: [jobs]
      summary: Ingest. Draws the master with ffmpeg, measures every frame, seals the proxy.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                fixture_id: {type: string, default: harbor-launch}
      responses:
        "201":
          description: Job created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Error"}

  /jobs/{job_id}:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get:
      tags: [jobs]
      responses:
        "200":
          description: Job with local paths removed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/events:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get:
      tags: [jobs]
      responses:
        "200":
          description: Ordered session log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: "#/components/schemas/JobId"}
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/Event"}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/proxy:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get:
      tags: [planning]
      summary: The anonymized metadata proxy, about 2 KB.
      responses:
        "200":
          description: "Proxy. Header `X-BrandForward-Export: metadata-proxy`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Proxy"}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/research:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    post:
      tags: [planning]
      summary: Ask a planner for an edit plan through the egress seam.
      description: >
        Link up with provider `scripted` returns the fixture's scripted cloud
        answer without transmitting. Provider `live` POSTs the proxy to an
        OpenAI-compatible endpoint. Link down, a cloud failure, or an answer
        outside the plan schema fails over to on-device planning (Ollama open
        weights, else the deterministic rule planner). With `revise`, the
        planner also receives that proposal's failed checks (no pixels).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                link: {type: string, enum: [up, down], description: Wins over `offline`.}
                offline: {type: boolean, default: false}
                provider: {type: string, enum: [scripted, live], default: scripted}
                revise: {type: string, description: Proposal id to revise.}
      responses:
        "200":
          description: New proposal.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, link_up, offline, provider, cloud_called, route, proposal]
                properties:
                  job_id: {$ref: "#/components/schemas/JobId"}
                  link_up: {type: boolean}
                  offline: {type: boolean}
                  provider: {type: string, enum: [scripted, live]}
                  cloud_called: {type: boolean, description: True only when bytes were transmitted.}
                  route: {type: string, enum: [cloud, local, local-failover]}
                  egress:
                    oneOf:
                      - {$ref: "#/components/schemas/Egress"}
                      - {type: "null", description: Null for an on-device revision.}
                  proposal: {$ref: "#/components/schemas/Proposal"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /jobs/{job_id}/egress/{seq}:
    parameters:
      - {$ref: "#/components/parameters/JobId"}
      - {name: seq, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [planning]
      summary: Exact request body built for that egress record (sent or not).
      responses:
        "200":
          description: "Chat-completions body. Header `X-BrandForward-Export: egress-payload`."
          content:
            application/json:
              schema: {type: object}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/verify:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    post:
      tags: [verification]
      summary: Cross-check a proposal against decoded frames, layout, and policy.
      requestBody: {$ref: "#/components/requestBodies/ProposalRef"}
      responses:
        "200":
          description: Cross-check report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CrossCheck"}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/receipt:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    post:
      tags: [verification]
      summary: Re-run the cross-check and sign an Ed25519 receipt (HOLD or CLEAR).
      requestBody: {$ref: "#/components/requestBodies/ProposalRef"}
      responses:
        "200":
          description: Signed receipt. Same inputs give the same body and signature.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Receipt"}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/receipt/verify:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    get:
      tags: [verification]
      summary: Verify every stored receipt against the pinned key.
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  valid: {type: boolean}
                  public_key: {type: string}
                  receipts:
                    type: array
                    items:
                      type: object
                      properties:
                        receipt_id: {type: string}
                        proposal_id: {type: string}
                        valid: {type: boolean}
                        verdict: {$ref: "#/components/schemas/Verdict"}
        "404": {$ref: "#/components/responses/NotFound"}

  /receipts/verify:
    post:
      tags: [verification]
      summary: Verify any receipt document (tamper test).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Receipt"}
      responses:
        "200":
          description: "Always 200; `valid` says whether the signature holds."
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  reason: {type: string}
                  public_key: {type: string}

  /jobs/{job_id}/render:
    parameters: [{$ref: "#/components/parameters/JobId"}]
    post:
      tags: [render]
      summary: ffmpeg render of the plan. Only after a verifiable CLEAR receipt.
      description: >
        409 unless a receipt for this proposal verifies, its verdict is clear,
        the proposal hash matches, the master on disk matches the signed hash,
        and a fresh cross-check still clears.
      requestBody: {$ref: "#/components/requestBodies/ProposalRef"}
      responses:
        "200":
          description: Rendered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {$ref: "#/components/schemas/JobId"}
                  verdict: {const: clear}
                  proposal_id: {type: string}
                  receipt_id: {type: string}
                  renderer: {const: ffmpeg}
                  sha256: {$ref: "#/components/schemas/Sha256"}
                  bytes: {type: integer}
                  output_name: {type: string, example: proof.mp4}
                  command: {type: array, items: {type: string}}
                  at: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /jobs/{job_id}/frames/{index}.jpg:
    parameters:
      - {$ref: "#/components/parameters/JobId"}
      - {name: index, in: path, required: true, schema: {type: integer, minimum: 0}}
      - name: w
        in: query
        schema: {type: integer, default: 640}
        description: Snapped to 320, 640, or 1280.
    get:
      tags: [media]
      summary: One decoded frame for the local console. Loopback only.
      responses:
        "200":
          description: JPEG.
          content:
            image/jpeg: {}
        "404": {$ref: "#/components/responses/NotFound"}

  /jobs/{job_id}/media/{name}:
    parameters:
      - {$ref: "#/components/parameters/JobId"}
      - name: name
        in: path
        required: true
        schema: {type: string, enum: [master.mp4, proof.mp4]}
    get:
      tags: [media]
      summary: Local playback of the master or the rendered proof. Loopback only.
      responses:
        "200":
          description: MP4.
          content:
            video/mp4: {}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/JobId"}

  requestBodies:
    ProposalRef:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [proposal_id]
            properties:
              proposal_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,80}$", example: cloud-1}

  responses:
    NotFound:
      description: Job, proposal, receipt, frame, media, or egress record not found.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Render blocked by the receipt gate, or nothing to revise.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Error:
      description: Local media step failed or the leakage guard blocked an export.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    JobId: {type: string, pattern: "^job_[0-9a-f]{16}$"}
    Sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    Timecode: {type: string, pattern: "^[0-9]{2}:[0-9]{2}\\.[0-9]{3}$"}
    Verdict: {type: string, enum: [hold, clear]}
    Interval:
      type: object
      required: [start, end]
      properties:
        start: {$ref: "#/components/schemas/Timecode"}
        end: {$ref: "#/components/schemas/Timecode"}

    Event:
      type: object
      required: [seq, stage, status, mode, at, message]
      properties:
        seq: {type: integer}
        stage: {type: string, enum: [ingest, vision, transcribe, proxy, research, verify, receipt, render]}
        status: {type: string, enum: [completed, blocked]}
        mode: {type: string, description: "ffmpeg, measured, fixture, sealed, cloud, local, local-failover, ed25519, gate"}
        at: {type: string, format: date-time}
        message: {type: string}
        cloud_called: {type: boolean}
        egress_seq: {type: integer}
        proposal_id: {type: string}
        verdict: {$ref: "#/components/schemas/Verdict"}
        bytes: {type: integer}

    Track:
      type: object
      properties:
        track_id: {type: string, enum: [product_hero, talent, wordmark]}
        kind: {type: string}
        label: {type: string}
        redacted: {type: boolean}
        redaction: {type: string, enum: [face]}
        evidence: {type: string, enum: [pixel-measured, scene-layout]}
        spans:
          type: array
          items:
            type: object
            properties:
              start: {$ref: "#/components/schemas/Timecode"}
              end: {$ref: "#/components/schemas/Timecode"}
              visible: {type: boolean}
              occlusion: {type: string, enum: [none, occluded]}
              face_present: {type: boolean}

    Proxy:
      type: object
      description: No pixels, file bytes, paths, or URLs. Enforced by the leakage guard.
      properties:
        schema: {const: brandforward.proxy.v2}
        asset_id: {type: string}
        asset_sha256: {$ref: "#/components/schemas/Sha256"}
        duration_ms: {type: integer}
        fps: {type: integer}
        frame_count: {type: integer}
        adapters:
          type: object
          properties:
            vision: {type: string, example: template-diff.v1}
            face: {type: string, example: scene-layout}
            asr: {type: string, example: fixture}
        languages: {type: array, items: {type: string}}
        tracks: {type: array, items: {$ref: "#/components/schemas/Track"}}
        transcript:
          type: array
          items:
            type: object
            properties:
              start: {$ref: "#/components/schemas/Timecode"}
              end: {$ref: "#/components/schemas/Timecode"}
              lang: {type: string}
              text: {type: string}
        keyframes:
          type: array
          description: One decoded-frame hash per second.
          items:
            type: object
            properties:
              timecode: {$ref: "#/components/schemas/Timecode"}
              sha256: {$ref: "#/components/schemas/Sha256"}

    Egress:
      type: object
      properties:
        seq: {type: integer}
        kind: {type: string, enum: [plan, revision]}
        provider: {type: string, enum: [scripted, live]}
        destination: {type: string}
        model: {type: string}
        status: {type: string, enum: [scripted, blocked, answered, failed, rejected]}
        transmitted: {type: boolean}
        bytes: {type: integer, description: Bytes actually transmitted.}
        payload_bytes: {type: integer, description: Size of the guarded request body.}
        payload_sha256: {$ref: "#/components/schemas/Sha256"}
        raw_media_bytes: {const: 0}
        guard: {const: pass}
        reason: {type: string}
        latency_ms: {type: integer}
        at: {type: string, format: date-time}

    Proposal:
      type: object
      description: A model's opinion, sealed to the proxy it saw.
      properties:
        id: {type: string, example: cloud-1}
        source: {type: string, enum: [cloud, local, local-failover]}
        provider: {type: string, enum: [scripted, live, ollama, rule]}
        model: {type: string}
        mode: {type: string, enum: [scripted, live, deterministic]}
        summary: {type: string}
        input_proxy_sha256: {$ref: "#/components/schemas/Sha256"}
        plan:
          type: object
          properties:
            wordmark_hold: {$ref: "#/components/schemas/Interval"}
            lower_third:
              allOf:
                - {$ref: "#/components/schemas/Interval"}
                - type: object
                  properties:
                    text: {type: string, maxLength: 64}
            face_blur: {type: boolean}
        claims:
          type: array
          items:
            allOf:
              - {$ref: "#/components/schemas/Interval"}
              - type: object
                properties:
                  id: {type: string}
                  track_id: {type: string, enum: [product_hero, talent, wordmark]}
                  asserted: {type: string, enum: [fully_visible, occluded]}
        revises: {type: string}
        created_at: {type: string, format: date-time}

    Check:
      type: object
      properties:
        id: {type: string, example: logo-hold-visible}
        kind: {type: string, enum: [measured, geometry, policy, layout]}
        source: {type: string, enum: [edit, claim, policy]}
        subject: {type: string}
        asserted: {type: string}
        interval:
          oneOf:
            - {$ref: "#/components/schemas/Interval"}
            - {type: "null"}
        observed: {type: string}
        passed: {type: boolean}
        reason: {type: string}
        evidence:
          type: object
          description: >
            For measured checks: method, frames_examined, first_frame,
            last_frame, frames_sha256, worst_frame, worst_timecode,
            worst_frame_sha256, worst_coverage_bp, threshold_bp.
          additionalProperties: true

    CrossCheck:
      type: object
      properties:
        job_id: {$ref: "#/components/schemas/JobId"}
        schema: {const: brandforward.cross-check.v2}
        proposal_id: {type: string}
        verdict: {$ref: "#/components/schemas/Verdict"}
        summary: {type: string}
        checks: {type: array, items: {$ref: "#/components/schemas/Check"}}

    Receipt:
      type: object
      required: [receipt_id, algorithm, public_key, signature, canonical_sha256, body]
      properties:
        receipt_id: {type: string, example: r_cebc405c2ff013a3}
        algorithm: {const: Ed25519}
        public_key: {type: string}
        signature: {type: string}
        canonical_sha256: {$ref: "#/components/schemas/Sha256"}
        body:
          type: object
          description: Signed bytes are the canonical JSON of this object. No wall-clock fields.
          properties:
            schema: {const: brandforward.receipt.v2}
            job_id: {$ref: "#/components/schemas/JobId"}
            fixture_id: {type: string}
            measured:
              type: object
              properties:
                asset_sha256: {$ref: "#/components/schemas/Sha256"}
                asset_bytes: {type: integer}
                frame_count: {type: integer}
                fps: {type: integer}
                vision_method: {type: string}
                template_sha256: {$ref: "#/components/schemas/Sha256"}
                ffmpeg: {type: string}
            opinion:
              type: object
              properties:
                proposal_id: {type: string}
                proposal_sha256: {$ref: "#/components/schemas/Sha256"}
                source: {type: string}
                provider: {type: string}
                model: {type: string}
                input_proxy_sha256: {$ref: "#/components/schemas/Sha256"}
            checks: {type: array, items: {$ref: "#/components/schemas/Check"}}
            verdict: {$ref: "#/components/schemas/Verdict"}
            issuer:
              type: object
              properties:
                node_id: {type: string}

    Job:
      type: object
      properties:
        id: {$ref: "#/components/schemas/JobId"}
        title: {type: string}
        fixture_id: {type: string}
        synopsis: {type: string}
        status: {type: string, enum: [ready, rendered]}
        node_id: {type: string}
        created_at: {type: string, format: date-time}
        asset:
          type: object
          properties:
            asset_id: {type: string}
            sha256: {$ref: "#/components/schemas/Sha256"}
            byte_length: {type: integer}
            duration_ms: {type: integer}
            width: {type: integer}
            height: {type: integer}
            fps: {type: integer}
            container: {const: mp4}
            origin: {const: generated-on-device}
            ffmpeg: {type: string}
            command: {type: array, items: {type: string}}
        vision:
          type: object
          properties:
            method: {type: string}
            fps: {type: integer}
            frame_count: {type: integer}
            threshold: {type: object}
            template_sha256: {$ref: "#/components/schemas/Sha256"}
            frames:
              type: array
              items:
                type: object
                properties:
                  index: {type: integer}
                  timecode: {$ref: "#/components/schemas/Timecode"}
                  sha256: {$ref: "#/components/schemas/Sha256"}
                  wordmark_coverage_bp: {type: integer, minimum: 0, maximum: 10000}
            tracks: {type: array, items: {$ref: "#/components/schemas/Track"}}
        transcript: {type: array, items: {type: object}}
        proxy: {$ref: "#/components/schemas/Proxy"}
        proxy_bytes: {type: integer}
        events: {type: array, items: {$ref: "#/components/schemas/Event"}}
        egress: {type: array, items: {$ref: "#/components/schemas/Egress"}}
        proposals: {type: array, items: {$ref: "#/components/schemas/Proposal"}}
        verifications: {type: array, items: {$ref: "#/components/schemas/CrossCheck"}}
        receipts: {type: array, items: {$ref: "#/components/schemas/Receipt"}}
        renders: {type: array, items: {type: object}}
