[project]
name = "brand-forward-engine"
version = "0.1.0"
description = "BrandForward local engine: on-device measurement, frame cross-check, and Ed25519 pre-publishability receipts."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162.2",
  "starlette>=1.10.0",
  "anyio>=4.16.0",
  "uvicorn>=0.54.0",
  "cryptography>=50.0.2",
  "anthropic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-xdist>=3.6",
  "httpx>=0.28.1",
]

[project.scripts]
brand-forward-engine = "brand_forward.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brand_forward*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
